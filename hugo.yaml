baseURL: "https://christianyang37.github.io/Blogs/"
theme: "PaperModX"
defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
enableEmoji: true
pagination:
  pagerSize: 10

outputs:
  home:
    - HTML
    - RSS
    - JSON

minify:
  disableXML: true

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ["$$", "$$"]
            - ["\\[", "\\]"]
          inline:
            - ["$", "$"]
            - ["\\(", "\\)"]
  highlight:
    style: dracula
    lineNos: false
    noClasses: false

taxonomies:
  category: categories

# Site-wide params (language-independent)
params:
  env: production
  mainSections:
    - posts
  defaultTheme: auto
  ShowReadingTime: true
  ShowWordCount: true
  ShowShareButtons: false
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  TocSide: "right"
  ShowPostNavLinks: true
  EnableInstantClick: true
  EnableImageZoom: true
  DateFormat: "2006-01-02"
  displayFullLangName: true

  math: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

languages:
  en:
    languageName: "English"
    weight: 1
    title: "Christian's Blog"
    params:
      description: "Notes on machine learning, AI safety, and deep learning theory."
      author: "Chiwun Yang"
      homeInfoParams:
        Title: "Hi, I'm Chiwun 👋"
        Content: |
          Welcome to my blog. I write about machine learning research, AI safety,
          and deep learning theory.

          ← Back to [my homepage](https://christianyang37.github.io/) for academic profile, publications, and CV.
      socialIcons:
        - name: github
          url: "https://github.com/ChristianYang37"
        - name: rss
          url: "index.xml"
    menu:
      main:
        - name: "← Homepage"
          url: "https://christianyang37.github.io/"
          weight: 1
          params:
            external: true
        - name: "Posts"
          pageRef: "/posts/"
          weight: 10
        - name: "Search"
          pageRef: "/search/"
          weight: 40

  zh:
    languageName: "中文"
    weight: 2
    title: "Christian 的博客"
    params:
      description: "机器学习研究、AI 安全与深度学习理论方向的笔记。"
      author: "Chiwun Yang"
      homeInfoParams:
        Title: "Hi，我是 Chiwun 👋"
        Content: |
          欢迎来到我的博客。这里写机器学习研究、AI 安全和深度学习理论方向的笔记。

          ← 回到 [我的主页](https://christianyang37.github.io/) 看学术档案、论文列表和 CV。
      socialIcons:
        - name: github
          url: "https://github.com/ChristianYang37"
        - name: rss
          url: "index.xml"
    menu:
      main:
        - name: "← 主页"
          url: "https://christianyang37.github.io/"
          weight: 1
          params:
            external: true
        - name: "文章"
          pageRef: "/posts/"
          weight: 10
        - name: "搜索"
          pageRef: "/search/"
          weight: 40
